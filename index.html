  if(t.dataset.t){const k=t.dataset.t;const v=+t.value;if(isn(v)){TH[k]=(k==="az"||k==="rz"||k==="st")?v:v/100}}});
let rq=false;const later=()=>{if(rq)return;rq=true;setTimeout(()=>{rq=false;render()},0)};
document.addEventListener("change",e=>{const d=e.target.dataset;if(d.t||d.f||d.c)later()});
document.addEventListener("keydown",e=>{const d=e.target.dataset||{};if(e.key==="Enter"&&(d.t||d.f||d.c))later()});
document.getElementById("cmdin").addEventListener("keydown",e=>{if(e.key==="Enter"){const v=e.target.value.trim().replace(/<?GO>?$/i,"").trim();e.target.value="";go(v.split(/\s+/)[0])}});
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(v&&v!==view)go(v)});
setInterval(()=>{const n=new Date();document.getElementById("clock").textContent=fd(n)+" "+n.toTimeString().slice(0,8)},1000);

/* ---------------- workbook loader ---------------- */
document.getElementById("file").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    if(typeof XLSX==="undefined")throw new Error("spreadsheet reader did not load");
    const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
    const val=(ws,a)=>{const c=ws[a];return c?c.v:undefined};
    const ds=wb.Sheets["Deals"];const deals=[];const rowId={};
    for(let r=5;r<500;r++){const tg=val(ds,"B"+r);if(tg==null||tg==="")break;
      const n=k=>{const v=val(ds,k+r);return typeof v==="number"?v:null},s=k=>{const v=val(ds,k+r);return v==null?"":String(v)};
      const d={id:n("A")??(r-4),target:s("B"),bidder:s("C"),type:s("D"),hq:s("E"),sector:s("F"),op_start:D(val(ds,"G"+r)),date27:D(val(ds,"H"+r)),consideration:s("J"),price:n("K"),total:n("L"),undisturbed:n("M"),rep_prem:n("O"),rep_vwap3m:n("R"),equity:n("S"),ev:n("T"),competing:s("U"),proposals:n("V"),target_fa:s("W"),bidder_fa:s("X"),status:s("Y"),note:s("Z"),source:(ds["AA"+r]&&ds["AA"+r].l&&ds["AA"+r].l.Target)||s("AA")};
      deals.push(d);rowId[r]=d.id}
    const pl=wb.Sheets["Price Log"],prices=[];
    if(pl){const rng=XLSX.utils.decode_range(pl["!ref"]);for(let r=5;r<=rng.e.r+1;r++){const dt=D(val(pl,"A"+r)),id=val(pl,"B"+r),px=val(pl,"D"+r);if(dt&&typeof id==="number"&&typeof px==="number")prices.push({date:dt,id,price:px,note:val(pl,"G"+r)||""})}}
    const exp={},fb={},notes={},offerOv={};const dh=wb.Sheets["Deal Health"];
    if(dh){for(let r=15;r<200;r++){const b=dh["B"+r];if(!b)continue;let id=typeof b.v==="number"?b.v:null;if(id==null&&b.f){const m=/Deals!\$?A\$?(\d+)/.exec(b.f);if(m)id=rowId[+m[1]]}if(id==null)continue;
      const e2=dh["E"+r];if(e2&&!e2.f&&typeof e2.v==="number")offerOv[id]=e2.v;
      const f2=dh["F"+r];if(f2&&!f2.f&&typeof f2.v==="number")fb[id]=f2.v;
      const g=D(val(dh,"G"+r));if(g)exp[id]=g;const s2=val(dh,"S"+r);if(s2)notes[id]=String(s2)}}
    const miles={},watch=[];const lt=wb.Sheets["Live Tracker"];
    if(lt){let on=false;for(let r=6;r<120;r++){const b=lt["B"+r];const bv=b?b.v:undefined;
      if(typeof bv==="string"&&bv.startsWith("Possible offers watchlist")){on=true;r++;continue}
      if(!on&&b&&b.f){const m=/Deals!\$?B\$?(\d+)/.exec(b.f);if(m&&rowId[+m[1]]!=null)miles[rowId[+m[1]]]=val(lt,"H"+r)||""}
      if(on&&typeof bv==="string"&&bv)watch.push({target:bv,bidder:val(lt,"C"+r)||"",reported:val(lt,"D"+r)||"",value:val(lt,"E"+r),consideration:val(lt,"F"+r)||"",note:val(lt,"H"+r)||""})}}
    if(!deals.length)throw new Error("no deals found on the Deals tab");
    S={deals:[...deals.map(d=>({...d,region:"UK",ccy:"p"})),...SNAP.deals.filter(d=>d.region==="US")],prices:[...prices,...SNAP.prices.filter(p=>p.id>=1000)],exp,fb,notes,miles,watch:watch.length?watch:S.watch,sectors:[...new Set([...SNAP.sectors,...deals.map(d=>d.sector).filter(Boolean)])].sort(),offerOv};
    newPx=[];setSrc("LOADED "+f.name.toUpperCase());render();
  }catch(err){document.getElementById("src").textContent="LOAD FAILED: "+err.message}
  e.target.value="";
});

loadSnapshot();go(location.hash.slice(1)||"menu");
</script>
