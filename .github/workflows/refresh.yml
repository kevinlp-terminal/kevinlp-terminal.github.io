name: Refresh KEVIN LP

on:
  schedule:
    # Weekdays (times in UTC = UK winter time): morning, midday, afternoon, after the close
    - cron: "35 8 * * 1-5"
    - cron: "35 11 * * 1-5"
    - cron: "35 14 * * 1-5"
    - cron: "50 16 * * 1-5"
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/refresh.yml", "engine/**"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install openpyxl yfinance pandas requests lxml
      - name: Update prices
        working-directory: engine
        run: python update_prices.py --refresh-today || echo "price update had problems - building with what we have"
      - name: Build page
        working-directory: engine
        run: python web/build_web.py UK_MA_Terminal.xlsx web/template.html ../index.html
      - name: Publish
        run: |
          git config user.name "KEVIN LP bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          # keep the workbook history small: save it once a day, after the close
          if [ "$(date -u +%H)" -ge 16 ] || [ "${{ github.event_name }}" != "schedule" ]; then
            git add engine/UK_MA_Terminal.xlsx
          fi
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "Auto refresh $(date -u +'%d %b %Y %H:%M') UTC"
          git push
